/* ── F&O ────────────────────────────────────────────────────────────────── */
const FO={under:'NIFTY',expiry:'',lots:1,spot:0,bias:'NEUTRAL',strategy:'',strategies:[],expiries:[],lot:0,plan:null};
/* the engine returns max_profit / max_loss as either a number or a phrase
   like "Unlimited (use stop-loss)" — render whichever it actually is */
const money = v => typeof v==='number' ? rs(v,0) : (v?String(v):'—');
/* plans come back with the strategy's display NAME; /api/fo/execute needs its
   key, so map back through the strategy list before executing */
function stratKey(plan){
  const n=String(plan&&plan.strategy||'').toLowerCase();
  const hit=FO.strategies.find(s=>s.name.toLowerCase()===n||s.key===n);
  return hit?hit.key:FO.strategy;
}
async function renderFO(){
  const box=$('#tradeBody');
  box.innerHTML=modeBanner()+'<div class="empty"><span class="spin"></span></div>';
  try{
    const [st,ex,ls]=await Promise.all([
      api('/api/fo/strategies'),
      api(`/api/fo/expiries?underlying=${FO.under}`),
      api(`/api/fo/lot_size?underlying=${FO.under}`),
    ]);
    FO.strategies=st.strategies||[]; FO.expiries=ex.expiries||[]; FO.lot=ls.lot_size||0;
    if(!FO.expiry&&FO.expiries.length) FO.expiry=FO.expiries[0];
    if(!FO.strategy&&FO.strategies.length) FO.strategy=FO.strategies[0].key;
    box.innerHTML = modeBanner()+
     `<div class="card">
        <div class="field2">
          <div class="field"><label class="fl">Underlying</label>
            <select class="f" id="foU">${['NIFTY','BANKNIFTY','FINNIFTY'].map(u=>`<option${u===FO.under?' selected':''}>${u}</option>`).join('')}</select></div>
          <div class="field"><label class="fl">Expiry</label>
            <select class="f" id="foE">${FO.expiries.length?FO.expiries.map(e=>`<option${e===FO.expiry?' selected':''}>${e}</option>`).join(''):'<option value="">—</option>'}</select></div>
        </div>
        <div class="field2">
          <div class="field"><label class="fl">Spot</label>
            <input class="f mono" id="foS" type="number" inputmode="decimal" value="${FO.spot||''}" placeholder="index level"></div>
          <div class="field"><label class="fl">Lots (×${FO.lot})</label>
            <input class="f mono" id="foL" type="number" inputmode="numeric" min="1" value="${FO.lots}"></div>
        </div>
        <label class="fl">Bias</label>
        <div class="chip-row" style="margin-bottom:12px">${['BULLISH','BEARISH','NEUTRAL','VOLATILE'].map(b=>
          `<button class="chip sm foB${b===FO.bias?' on':''}" data-b="${b}">${b}</button>`).join('')}</div>
        <div class="row" style="gap:6px">
          <button class="chip" id="foRec" style="flex:1">✨ Recommend</button>
          <button class="chip" id="foChain" style="flex:1">⛓ Chain</button>
          <button class="chip" id="foRef">⟳</button>
        </div>
      </div>
      <div class="card">
        <div class="card-t">Build a strategy</div>
        <div class="card-s">${FO.strategies.length} strategies · plan first, then execute every leg.</div>
        <select class="f" id="foStrat" style="margin-bottom:10px">${FO.strategies.map(s=>
          `<option value="${s.key}"${s.key===FO.strategy?' selected':''}>${esc(s.name)} · ${esc(s.bias)} · ${esc(s.risk)}</option>`).join('')}</select>
        <div class="hint" id="foDesc" style="margin-bottom:10px"></div>
        <button class="btn full" id="foPlan">Build plan</button>
      </div>
      <div id="foOut"></div>`;
    const upd=()=>{ const s=FO.strategies.find(x=>x.key===FO.strategy); $('#foDesc').textContent=s?s.desc:''; };
    upd();
    $('#foU').onchange=e=>{ FO.under=e.target.value; FO.expiry=''; renderFO(); };
    $('#foE').onchange=e=>FO.expiry=e.target.value;
    $('#foS').oninput =e=>FO.spot=+e.target.value;
    $('#foL').oninput =e=>FO.lots=+e.target.value;
    $('#foStrat').onchange=e=>{ FO.strategy=e.target.value; upd(); };
    $$('.foB').forEach(b=>b.onclick=()=>{ FO.bias=b.dataset.b; $$('.foB').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
    $('#foRef').onclick=async()=>{ toast('refreshing F&O instruments…'); const r=await post('/api/fo/refresh_instruments'); toast(r.ok?`✓ ${r.total} contracts`:'refresh failed'); renderFO(); };
    $('#foRec').onclick=foRecommend;
    $('#foChain').onclick=foShowChain;
    $('#foPlan').onclick=foBuildPlan;
  }catch(e){ box.innerHTML=modeBanner()+'<div class="empty">F&O data unavailable</div>'; }
}
function foLegs(p){
  return `<div class="tw"><table class="t"><thead><tr><th>Side</th><th>Type</th><th>Strike</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody>${(p.legs||[]).map(l=>`<tr>
      <td class="${l.side==='BUY'?'g':'r'}" style="font-weight:700">${esc(l.side)}</td>
      <td>${esc(l.instrument)}${l.option_type?' '+esc(l.option_type):''}</td>
      <td class="mono">${l.strike?nf(l.strike,0):'—'}</td>
      <td class="mono">${l.qty}</td><td class="mono">${nf(l.price)}</td></tr>`).join('')}</tbody></table></div>`;
}
function foPlanCard(p,idx){
  return `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <div><div class="card-t">${esc(p.strategy||'')}</div>
      <div class="hint">${esc(p.underlying||'')} · ${esc(p.expiry||'')} · ${p.lots} lot(s) × ${p.lot_size} = ${p.qty}</div></div>
      <span class="pill ${p.bias==='BULLISH'?'g':p.bias==='BEARISH'?'r':'b'}">${esc(p.bias||'')}</span></div>
    ${foLegs(p)}
    <div class="tiles" style="margin-top:10px">
      <div class="tile"><span>Max profit</span><b class="mono g">${money(p.max_profit)}</b></div>
      <div class="tile"><span>Max loss</span><b class="mono r">${money(p.max_loss)}</b></div>
      <div class="tile"><span>Breakeven</span><b class="mono">${p.breakeven!=null?nf(p.breakeven,1):
        (p.breakeven_lower!=null?nf(p.breakeven_lower,1)+' / '+nf(p.breakeven_upper,1):'—')}</b></div>
      <div class="tile"><span>Margin</span><b class="mono">${rs(p.margin_required,0)}</b></div>
    </div>
    <div class="hint" style="margin-top:8px">Risk: <b class="${p.risk_type==='UNLIMITED'?'r':'g'}">${esc(p.risk_type||'')}</b></div>
    <button class="btn full" style="margin-top:10px" onclick="foConfirmExec(${idx})">Execute all legs</button>
  </div>`;
}
let foPlans=[];
async function foBuildPlan(){
  if(!(FO.spot>0)) return toast('Enter the current spot / index level.');
  $('#foOut').innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    const r=await post('/api/fo/plan',{strategy:FO.strategy,underlying:FO.under,spot:FO.spot,expiry:FO.expiry,lots:FO.lots});
    if(!r.ok){ $('#foOut').innerHTML=`<div class="status err">${esc(r.error||'plan failed')}</div>`; return; }
    foPlans=[r.plan]; $('#foOut').innerHTML=foPlanCard(r.plan,0);
  }catch(e){ $('#foOut').innerHTML='<div class="status err">plan failed</div>'; }
}
async function foRecommend(){
  if(!(FO.spot>0)) return toast('Enter the current spot / index level.');
  $('#foOut').innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    const r=await api(`/api/fo/recommend?underlying=${FO.under}&spot=${FO.spot}&expiry=${encodeURIComponent(FO.expiry)}&bias=${FO.bias}&lots=${FO.lots}`);
    if(!r.ok){ $('#foOut').innerHTML=`<div class="status err">${esc(r.error||'no recommendation')}</div>`; return; }
    foPlans=r.strategies||[];
    $('#foOut').innerHTML=`<div class="sec-label">Best fit for ${esc(r.bias)} @ ${nf(r.spot,0)}</div>`+foPlans.map((p,i)=>foPlanCard(p,i)).join('');
  }catch(e){ $('#foOut').innerHTML='<div class="status err">recommendation failed</div>'; }
}
async function foShowChain(){
  sheet('Option chain','<div class="empty"><span class="spin"></span></div>');
  try{
    const r=await api(`/api/fo/chain?underlying=${FO.under}&expiry=${encodeURIComponent(FO.expiry)}&itype=OPTIDX`);
    const rows=(r.instruments||[]);
    const byStrike={};
    rows.forEach(x=>{ if(!x.strike) return; byStrike[x.strike]=byStrike[x.strike]||{};
      byStrike[x.strike][x.option_type]=x.sym; });
    const ks=Object.keys(byStrike).map(Number).sort((a,b)=>a-b);
    $('#shB').innerHTML = ks.length
      ? `<div class="hint" style="margin-bottom:8px">${esc(FO.under)} · ${esc(r.expiry||FO.expiry)} · ${ks.length} strikes · tap to load into the ticket</div>
         <div class="tw"><table class="t"><thead><tr><th>CE</th><th>Strike</th><th>PE</th></tr></thead><tbody>
         ${ks.map(k=>`<tr>
           <td style="text-align:left"><button class="chip sm" onclick="foPick('${esc(byStrike[k].CE||'')}')">${byStrike[k].CE?'CE':'—'}</button></td>
           <td class="mono" style="text-align:center;font-weight:700">${nf(k,0)}</td>
           <td><button class="chip sm" onclick="foPick('${esc(byStrike[k].PE||'')}')">${byStrike[k].PE?'PE':'—'}</button></td></tr>`).join('')}
         </tbody></table></div>`
      : '<div class="empty">no chain available</div>';
  }catch(e){ $('#shB').innerHTML='<div class="empty">chain unavailable</div>'; }
}
function foPick(sym){
  if(!sym) return;
  S.sym=sym; setHeader(); sheetClose();
  S.tradeSub='ticket'; $$('#tradeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.s==='ticket'));
  startTradeTab(); toast('Loaded '+sym+' into the ticket');
}
function foConfirmExec(i){
  const p=foPlans[i]; if(!p) return;
  const live=T.status&&!T.status.mock_mode;
  sheet('Confirm F&O execution',
    `${live?'<div class="status err" style="margin-bottom:10px"><b>⚠ LIVE MODE — real money, all legs.</b></div>'
           :'<div class="status" style="margin-bottom:10px">📄 Paper trade — simulated.</div>'}
     <div style="font-weight:700;margin-bottom:6px">${esc(p.strategy||'')}</div>
     <div class="hint" style="margin-bottom:10px">${(p.legs||[]).length} legs · margin ${rs(p.margin_required,0)} · max loss ${money(p.max_loss)}</div>
     ${foLegs(p)}
     <button class="btn full sell" id="foGo" style="margin-top:14px">Execute ${(p.legs||[]).length} legs</button>
     <button class="btn full" id="foNo" style="margin-top:8px">Cancel</button>`,
    ()=>{ $('#foNo').onclick=sheetClose;
      $('#foGo').onclick=async()=>{
        $('#foGo').disabled=true; $('#foGo').textContent='sending…';
        try{
          const r=await post('/api/fo/execute',{strategy:stratKey(p),underlying:p.underlying||FO.under,
            spot:FO.spot,expiry:p.expiry||FO.expiry,lots:p.lots||FO.lots});
          sheetClose();
          toast(r.ok?`${r.legs_filled}/${r.legs_total} legs filled`:'Execution failed: '+(r.error||''));
          if(r.ok){ S.tradeSub='orders'; $$('#tradeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.s==='orders')); startTradeTab(); }
        }catch(e){ sheetClose(); toast('Network error during execution.'); }
      };});
}
/* ═══════════════════════════════════════════════════════════════════════════
   BOOT — last, so every module's constants are initialised before it runs
   ═══════════════════════════════════════════════════════════════════════════ */
/* Adopt the first watchlist instrument when none was given. Without this,
   opening straight onto a non-Watch tab — which is exactly what the Android
   launcher shortcuts and ?tab= deep links do — lands on an empty screen. */
async function seedSymbol(){
  try{
    const d=await api('/api/yahoo/symbols');
    const first=(d.symbols||[])[0];
    if(first && !S.sym){ S.sym=first.tsym; S.name=first.name||''; setHeader(); }
  }catch(e){}
}

(async function boot(){
  const p=new URLSearchParams(location.search);
  const deep=p.get('tsym');
  if(deep){ S.sym=deep.toUpperCase(); }
  setHeader();
  const t=p.get('tab'); if(t && ['watch','chart','flow','plan','trade'].includes(t)) S.tab=t;
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  buildTfRow();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(!S.sym && S.tab!=='watch') await seedSymbol();
  nav(S.tab);
})();
</script>
