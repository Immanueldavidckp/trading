<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Plan · trade.scratchforge</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#111826; --panel2:#0d1420; --border:#20293b;
    --ink:#e7edf6; --muted:#93a2ba; --faint:#5f6d84;
    --green:#2fd08c; --red:#ff5d6c; --amber:#e8b24a; --blue:#5e8eff; --violet:#a880ff;
    --green-bg:rgba(47,208,140,.12); --red-bg:rgba(255,93,108,.11); --amber-bg:rgba(232,178,74,.14); --blue-bg:rgba(94,142,255,.12);
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  .mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
  a{color:var(--blue)}
  header{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:16px;letter-spacing:-.3px}
  .brand span{color:var(--faint);font-weight:400}
  .tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px}
  .tab{padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);border:none;background:none}
  .tab.on{background:var(--blue);color:#fff}
  .tab.swing.on{background:var(--violet)}
  .chip.stage{color:var(--violet);background:rgba(168,128,255,.12);border-color:rgba(168,128,255,.4)}
  .ewin{background:rgba(168,128,255,.10);border:1px solid rgba(168,128,255,.35);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:10px}
  .spacer{flex:1}
  select,button.act{background:var(--panel2);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12px;cursor:pointer}
  button.act:hover{border-color:var(--blue)}
  .wrap{max-width:1280px;margin:0 auto;padding:18px}
  .disc{background:var(--amber-bg);border:1px solid rgba(232,178,74,.35);color:var(--amber);border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:16px}
  .disc b{color:var(--ink)}
  .ubar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .ubar b{color:var(--ink)}

  /* plan cards */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .chead{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
  .chead:hover{background:var(--panel2)}
  .rankn{font-family:var(--mono);font-weight:800;color:var(--faint);text-align:center}
  .sym{font-weight:800;font-size:16px}
  .csub{color:var(--muted);font-size:12px}
  .chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
  .chip.bull{color:var(--green);background:var(--green-bg);border-color:rgba(47,208,140,.4)}
  .chip.bear{color:var(--red);background:var(--red-bg);border-color:rgba(255,93,108,.4)}
  .chip.neut{color:var(--muted)}
  .chip.high{color:var(--green);background:var(--green-bg)} .chip.medium{color:var(--amber);background:var(--amber-bg)} .chip.low{color:var(--faint)}
  .chip.score{color:var(--blue);background:var(--blue-bg)}
  .dlbtn{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap}
  .dlbtn:hover{border-color:var(--blue);color:var(--blue)}
  .chip.lowr{color:var(--red);background:var(--red-bg)}

  /* sector groups — the 200-name universe folded into openable sectors */
  .sec{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--panel2);overflow:hidden}
  .sechead{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;
    padding:11px 16px;cursor:pointer;user-select:none}
  .sechead:hover{background:var(--panel)}
  .sec.open .sechead{background:var(--panel);border-bottom:1px solid var(--border)}
  .secarrow{font-family:var(--mono);color:var(--faint);transition:transform .12s}
  .sec.open .secarrow{transform:rotate(90deg)}
  .secname{font-weight:800;font-size:14.5px;letter-spacing:-.2px}
  .secname .n{color:var(--faint);font-weight:500;font-size:12px;margin-left:8px;font-family:var(--mono)}
  .secbody{display:none;padding:12px}
  .sec.open .secbody{display:block}
  .secbody .card{background:var(--panel)}
  .chip.entry{color:#0b0f17;background:var(--green);border-color:var(--green)}
  .chip.noentry{color:var(--faint)}
  .chip.sector{color:var(--violet);background:rgba(168,128,255,.10);border-color:rgba(168,128,255,.3)}
  .card.hasentry{border-color:rgba(47,208,140,.45)}
  .card.hasentry .chead{box-shadow:inset 3px 0 0 var(--green)}

  /* monitor: three phase columns */
  .phase{border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--panel2)}
  .phase-h{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:800;border-bottom:1px solid var(--border)}
  .phase-h .n{font-family:var(--mono);font-weight:500;color:var(--faint);font-size:12px}
  .phase.ENTRY .phase-h{color:var(--green);background:rgba(47,208,140,.08)}
  .phase.MONITOR .phase-h{color:var(--blue);background:rgba(94,142,255,.08)}
  .phase.NO_ENTRY .phase-h{color:var(--faint)}
  .mrow{display:grid;grid-template-columns:120px 1fr 150px 130px 130px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  .mrow:last-child{border-bottom:none}
  .mrow.at_entry,.mrow.in_trade{box-shadow:inset 3px 0 0 var(--green)}
  .mrow.approaching{box-shadow:inset 3px 0 0 var(--amber)}
  .mrow.broken,.mrow.ran_away{box-shadow:inset 3px 0 0 var(--red)}
  .mrow .sym{font-size:15px}
  .st{font-family:var(--mono);font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
  .st.at_entry,.st.in_trade{color:#0b0f17;background:var(--green);border-color:var(--green)}
  .st.approaching{color:var(--amber);background:var(--amber-bg);border-color:rgba(232,178,74,.5)}
  .st.watching{color:var(--blue);background:var(--blue-bg)}
  .st.closed{color:var(--muted)}
  .st.broken,.st.ran_away{color:var(--red);background:var(--red-bg);border-color:rgba(255,93,108,.4)}
  .st.expired,.st.superseded{color:var(--faint)}
  .why{color:var(--muted);font-size:12px;margin-top:3px}
  .hist{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px}
  .arow{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
  .arow.unread{background:rgba(94,142,255,.06)}
  .arow .lvl{font-family:var(--mono);font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:6px}
  .lvl.high{color:#0b0f17;background:var(--green)} .lvl.warn{color:var(--red);background:var(--red-bg)}
  .lvl.info{color:var(--blue);background:var(--blue-bg)} .lvl.low{color:var(--faint);background:var(--panel2)}
  @media(max-width:900px){.mrow{grid-template-columns:1fr 1fr}}

  /* scorecard: plan (left) vs actual (right) */
  .sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.sc-grid{grid-template-columns:1fr}}
  .colbox{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
  .colhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .verd{font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .verd.RIGHT{color:var(--green);background:var(--green-bg)}
  .verd.WRONG{color:var(--red);background:var(--red-bg)}
  .verd.NA,.verd.INFO{color:var(--faint);background:var(--panel)}
  .cbody{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
  .card.open .cbody{display:block}
  .card.open .chead{background:var(--panel2)}
  h4{margin:16px 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
  .lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .lv{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .lv .t{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
  .lv .v{font-family:var(--mono);font-size:12.5px;margin-top:3px}
  .daytype{background:var(--blue-bg);border:1px solid rgba(94,142,255,.3);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink)}
  .headline{background:linear-gradient(180deg,rgba(94,142,255,.10),rgba(94,142,255,.03));border:1px solid rgba(94,142,255,.3);border-radius:10px;padding:12px 14px;margin:14px 0 6px}
  .hl-read{font-weight:800;font-size:14.5px;margin-bottom:8px}
  .hl-play{font-size:13px;color:var(--ink);background:var(--green-bg);border-left:3px solid var(--green);padding:7px 11px;border-radius:6px;margin-bottom:9px}
  .hl-if{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)} .hl-if li{margin-bottom:5px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  .scroll{overflow-x:auto}
  th{text-align:left;color:var(--faint);font-weight:600;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .side{font-family:var(--mono);font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px}
  .side.LONG{color:var(--green);background:var(--green-bg)} .side.SHORT{color:var(--red);background:var(--red-bg)}
  .q{font-size:10px;color:var(--faint)}
  .tgt{font-family:var(--mono)} .tgt b{color:var(--green)}
  .whenok{color:var(--muted);font-size:11.5px} .whenno{color:var(--red);font-size:11.5px}
  .scenrow{display:grid;grid-template-columns:1.1fr .8fr 1.4fr;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--panel2);font-size:12px}
  .scenrow .w{font-family:var(--mono);color:var(--blue)}
  ul.rules{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px} ul.rules li{margin-bottom:5px}
  ul.rules.no li{color:var(--red)}

  /* scorecard */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .tile .t{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}
  .tile .v{font-size:22px;font-weight:800;margin-top:3px;font-family:var(--mono)}
  .tile .v.pos{color:var(--green)} .tile .v.neg{color:var(--red)}
  .tile .d{font-size:11px;color:var(--muted);margin-top:2px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .empty{padding:50px;text-align:center;color:var(--faint)}
  .foot{color:var(--faint);font-size:11.5px;margin-top:24px;line-height:1.6}
  @media(max-width:640px){.scenrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">trade.scratchforge <span>· daily plan</span></div>
  <div class="tabs" title="Day trade = tomorrow's intraday plan · Swing trade = 2–22 session delivery plan (up to ~1 month)">
    <button class="tab on" id="modeDay" onclick="setMode('day')">Day trade</button>
    <button class="tab swing" id="modeSwing" onclick="setMode('swing')">Swing trade</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabPlan" onclick="showTab('plan')">Plan</button>
    <button class="tab" id="tabMonitor" onclick="showTab('monitor')" title="Live: is each swing setup still worth watching, filled, or dead?">Monitor <span id="monBadge" class="chip entry" style="display:none;margin-left:4px;padding:1px 6px"></span></button>
    <button class="tab" id="tabScore" onclick="showTab('score')">Scorecard</button>
  </div>
  <div class="tabs" id="viewTabs" title="Group the universe by sector, or show one flat ranked list">
    <button class="tab on" id="viewSector" onclick="setView('sector')">Sectors</button>
    <button class="tab" id="viewFlat" onclick="setView('flat')">All</button>
  </div>
  <div class="spacer"></div>
  <button class="act" id="expandBtn" onclick="toggleAllSectors()" title="Open or close every sector">⇕ Expand all</button>
  <button class="act" id="dlAllBtn" onclick="downloadAll()" title="Download the WHOLE day's plan as a text file">⬇ TXT</button>
  <select id="dateSel" onchange="reload()"></select>
  <button class="act" id="buildBtn" onclick="runBuild()" title="Build the plan for the next session (heavy)">⚙ Build next</button>
  <button class="act" id="scoreBtn" onclick="runScore()" title="Score the selected date vs actual candles">✓ Score date</button>
  <a class="act" href="/live.html" style="text-decoration:none">← Chart</a>
</header>

<div class="wrap">
  <div id="status" style="color:var(--muted);font-size:12.5px;margin-bottom:12px;display:none"></div>

  <div id="planView">
    <div class="ubar" id="ubar"></div>
    <div class="ubar" id="autobar" style="display:none"></div>
    <div id="cards"></div>
  </div>

  <div id="monitorView" style="display:none">
    <div class="ubar" id="monBar"></div>
    <div class="tiles" id="monTiles"></div>
    <div id="monPhases"></div>
    <h4 style="margin-top:22px">Alerts <span class="q">— one per transition, newest first</span>
      <button class="dlbtn" id="notifBtn" onclick="enableNotifs()" style="margin-left:10px">🔔 Enable popups</button>
      <button class="dlbtn" onclick="ackAllAlerts()" style="margin-left:6px">✓ Mark all read</button></h4>
    <div id="monAlerts" class="card" style="max-height:340px;overflow:auto"></div>
  </div>
  <div id="scoreView" style="display:none">
    <div class="tiles" id="tiles"></div>
    <div class="disc" id="honesty" style="display:none"></div>
    <div class="scroll"><div id="results"></div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let TAB='plan';
let MODE='day';               // 'day' = intraday plan · 'swing' = 2–15 day delivery plan
let VIEW='sector';            // 'sector' = grouped, openable sectors · 'flat' = one ranked list
let PLANS=[], PLAN_DATE='';   // last-rendered plan list, already in priority order
const SEC_OPEN={};            // sector name -> open?  (survives re-renders)
const fmt=(v,d=2)=>(v==null||v===''||isNaN(v))?'—':Number(v).toFixed(d);
const pct=v=>(v==null||isNaN(v))?'—':(v>=0?'+':'')+Number(v).toFixed(2)+'%';
const todayIST=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});   // YYYY-MM-DD

// every data endpoint has a day and a swing variant — one switch, no scattering
const api={
  dates:   () =>MODE==='day'?'/api/plan/dates':'/api/swing/dates',
  report:  d =>(MODE==='day'?'/api/plan/report?date=':'/api/swing/report?date=')+d,
  scorecard:d=>(MODE==='day'?'/api/plan/scorecard?date=':'/api/swing/scorecard?date=')+d,
  build:   () =>MODE==='day'?'/api/plan/build':'/api/swing/build',
  score:   d =>(MODE==='day'?'/api/plan/score?plan_date=':'/api/swing/score?plan_date=')+d,
};
function openChart(t){location.href='/live.html?tsym='+encodeURIComponent(t);}

// ---------- priority ordering ----------
// The rule, in one place: a stock with an actual entry outranks one without,
// and inside each of those two blocks the higher confluence score comes first
// (universe turnover rank breaks ties). Used for the flat list, for the order
// of stocks inside a sector, AND for the order of the sectors themselves.
const hasEntry=p=>((p.num_setups!=null?p.num_setups:(p.setups||[]).length)>0);
function byPriority(a,b){
  const ea=hasEntry(a)?0:1, eb=hasEntry(b)?0:1;
  if(ea!==eb) return ea-eb;                                  // entries first
  const sa=(a.score==null?-1:a.score), sb=(b.score==null?-1:b.score);
  if(sb!==sa) return sb-sa;                                  // then ranking (score)
  return (a.universe_rank||9999)-(b.universe_rank||9999);    // then turnover rank
}
const sectorOf=p=>p.sector||'Unclassified';

function setView(v){
  if(VIEW===v) return;
  VIEW=v;
  $('viewSector').classList.toggle('on',v==='sector');
  $('viewFlat').classList.toggle('on',v==='flat');
  $('expandBtn').style.display = v==='sector' ? '' : 'none';
  if(TAB==='plan') renderCards();
}

function toggleSector(name){
  SEC_OPEN[name]=!SEC_OPEN[name];
  const el=document.getElementById('sec_'+cssId(name));
  if(el) el.classList.toggle('open',SEC_OPEN[name]);
}
function toggleAllSectors(){
  const names=[...new Set(PLANS.map(sectorOf))];
  const anyClosed=names.some(n=>!SEC_OPEN[n]);
  names.forEach(n=>{SEC_OPEN[n]=anyClosed;});
  $('expandBtn').textContent = anyClosed ? '⇕ Collapse all' : '⇕ Expand all';
  renderCards();
}
const cssId=n=>n.replace(/[^A-Za-z0-9]/g,'_');
const esc=n=>String(n).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function setMode(m){
  if(MODE===m) return;
  MODE=m;
  $('modeDay').classList.toggle('on',m==='day');$('modeSwing').classList.toggle('on',m==='swing');
  $('buildBtn').title = m==='day' ? 'Build the plan for the next session (heavy)'
                                  : 'Build the next-session SWING plan (2–15 day holds)';
  PLANS=[]; PLAN_DATE='';
  clearTimeout(_buildPoll);
  reload(true);   // re-pick the right default date from that mode's own dates
  resumeBuildIfRunning();
}

function showTab(t){
  const prevTab=TAB; TAB=t;
  $('tabPlan').classList.toggle('on',t==='plan');$('tabScore').classList.toggle('on',t==='score');
  $('tabMonitor').classList.toggle('on',t==='monitor');
  $('planView').style.display=t==='plan'?'':'none';$('scoreView').style.display=t==='score'?'':'none';
  $('monitorView').style.display=t==='monitor'?'':'none';
  $('viewTabs').style.display=t==='plan'?'':'none';
  $('expandBtn').style.display=(t==='plan'&&VIEW==='sector')?'':'none';
  $('dlAllBtn').title = t==='score' ? "Download this date's SCORECARD (plan-vs-actual analysis) as a text file"
                                    : "Download the WHOLE day's plan as a text file";
  clearInterval(_monT);
  if(t==='monitor'){ renderMonitor(); _monT=setInterval(renderMonitor, 30000); return; }
  reload(prevTab!==t);   // switching tabs re-picks the sensible default date for that tab
}

async function loadDates(forceDefault){
  const j=await fetch(api.dates()).then(r=>r.json());
  // Both tabs list every plan date — picking an unscored past date on the
  // Scorecard auto-scores it; a future date (nothing traded yet) is shown
  // plainly instead of being queried.
  const dates=[...new Set([...(j.plan_dates||[]),...(j.scored_dates||[])])].sort().reverse();
  const sel=$('dateSel');
  const prevVal=sel.value;
  sel.innerHTML = dates.length ? dates.map(d=>`<option value="${d}">${d}</option>`).join('')
                               : '<option value="">— none yet —</option>';
  if(!dates.length) return dates;
  const today=todayIST();
  if(!forceDefault && dates.includes(prevVal)){ sel.value=prevVal; return dates; }
  if(TAB==='score'){
    // Scorecard needs a session that has ALREADY happened — default to the
    // newest date strictly before today, not just the newest plan (which is
    // usually tomorrow's, and would otherwise silently try to score the future).
    const past=dates.find(d=>d<today);
    sel.value = past || dates[dates.length-1];
  } else {
    sel.value = dates[0];   // Plan tab: newest (tomorrow's) plan is the useful default
  }
  return dates;
}

// The plan rebuilds itself every evening the market traded. Show that state so
// a stale-looking date reads as "not a session yet", not "the build is broken".
async function loadAutoStatus(){
  const bar=$('autobar'); if(!bar) return;
  try{
    const j=await fetch('/api/autobuild/status').then(r=>r.json());
    const c=j.calendar||{}, d=j.decision_now||{};
    if(!j.enabled){ bar.style.display=''; bar.innerHTML='⏸ Auto-build is <b>off</b> (AUTO_BUILD=0) — use ⚙ Build next.'; return; }
    const dot = j.last_status==='ok' ? '🟢' : j.last_status==='error' ? '🔴' : '⚪';
    const bits=[`${dot} Auto-build <b>${j.running?'armed':'not running'}</b> · ${j.build_time_ist} IST daily`];
    if(j.last_built_for) bits.push(`last built <b>${j.last_built_for}</b>${j.last_run_at?` (${j.last_run_at.replace('T',' ').slice(0,16)})`:''}`);
    if((c.today_status||{}).open===false) bits.push(`today: ${c.today_status.why}`);
    if(c.next_trading_day) bits.push(`next session <b>${c.next_trading_day}</b>`);
    if(d.reason) bits.push(`<span class="q">${d.reason}</span>`);
    if(j.last_status==='error'&&j.last_error) bits.push(`<span style="color:var(--red)">last error: ${j.last_error.slice(0,120)}</span>`);
    bar.style.display=''; bar.innerHTML=bits.join(' · ');
  }catch(e){ bar.style.display='none'; }
}

// ---------- PLAN ----------
async function renderPlan(date){
  const cards=$('cards'); const ubar=$('ubar');
  $('expandBtn').style.display = VIEW==='sector' ? '' : 'none';
  if(!date){ ubar.innerHTML=''; cards.innerHTML='<div class="empty">No '+(MODE==='swing'?'swing':'day')+' plan built yet. Click <b>⚙ Build next</b> to generate it for the top-200 stocks under ₹300.</div>'; return; }
  cards.innerHTML='<div class="empty">loading…</div>';
  const j=await fetch(api.report(date)).then(r=>r.json());
  if(!j.ok||!j.plans.length){ cards.innerHTML='<div class="empty">No '+(MODE==='swing'?'swing ':'')+'plans for '+date+'.</div>'; ubar.innerHTML=''; PLANS=[]; return; }
  // Sort ONCE here: PLANS is the priority order everywhere after this — the
  // cards, the sector groups and the TXT exports all index into it.
  PLANS=(j.plans||[]).slice().sort(byPriority); PLAN_DATE=date;

  // First load of a date opens the top-priority sector so the page isn't a
  // wall of closed rows; everything else stays closed until clicked.
  const secs=[...new Set(PLANS.map(sectorOf))];
  if(!secs.some(n=>SEC_OPEN[n])){
    const first=sectorGroups()[0];
    if(first) SEC_OPEN[first.name]=true;
  }

  const nEntry=PLANS.filter(hasEntry).length;
  const nSec=secs.length;
  ubar.innerHTML = (MODE==='swing'
      ? `Swing plan live from <b>${date}</b> · <b>${j.count}</b> stocks · 2–22 session holds (up to ~1 month)`
      : `Plan for <b>${date}</b> · <b>${j.count}</b> stocks`)
    + ` · <b>${nEntry}</b> with an entry · <b>${nSec}</b> sectors`
    + ` · entries first, then confluence score`;
  renderCards();
}

const cardFor=(p,i)=>MODE==='swing'?swingCard(p,i):planCard(p,i);

function renderCards(){
  const cards=$('cards');
  if(!PLANS.length){ cards.innerHTML='<div class="empty">Nothing to show.</div>'; return; }
  cards.innerHTML = VIEW==='sector'
    ? sectorGroups().map(g=>sectorBlock(g)).join('')
    : PLANS.map((p,i)=>cardFor(p,i)).join('');
}

// Group the (already priority-sorted) plans by sector. Sector order follows the
// same rule as the stocks: sectors holding entries come first (more entries
// first), then by their best confluence score. "Unclassified" always last.
function sectorGroups(){
  const map=new Map();
  PLANS.forEach((p,i)=>{
    const k=sectorOf(p);
    if(!map.has(k)) map.set(k,[]);
    map.get(k).push(i);
  });
  const groups=[...map.entries()].map(([name,idx])=>({
    name, idx,
    entries: idx.filter(i=>hasEntry(PLANS[i])).length,
    best: Math.max(...idx.map(i=>PLANS[i].score==null?-1:PLANS[i].score)),
    bestRank: Math.min(...idx.map(i=>PLANS[i].universe_rank||9999)),
  }));
  groups.sort((a,b)=>
    (b.entries>0?1:0)-(a.entries>0?1:0) ||                                  // entry sectors first
    (a.name==='Unclassified'?1:0)-(b.name==='Unclassified'?1:0) ||          // …then the catch-all last
    b.entries-a.entries ||
    b.best-a.best ||
    a.bestRank-b.bestRank);
  return groups;
}

function sectorBlock(g){
  const open=!!SEC_OPEN[g.name];
  const entryChip = g.entries
    ? `<span class="chip entry">${g.entries} entr${g.entries===1?'y':'ies'}</span>`
    : `<span class="chip noentry">no entry</span>`;
  return `<div class="sec${open?' open':''}" id="sec_${cssId(g.name)}">
    <div class="sechead" onclick="toggleSector('${g.name.replace(/'/g,"\\'")}')">
      <div class="secarrow">▸</div>
      <div class="secname">${esc(g.name)}<span class="n">${g.idx.length} stock${g.idx.length===1?'':'s'}</span></div>
      <div class="chips">${entryChip}<span class="chip score">best ${g.best<0?'—':g.best}</span></div>
    </div>
    <div class="secbody">${g.idx.map(i=>cardFor(PLANS[i],i)).join('')}</div>
  </div>`;
}

      <div class="csub" style="margin-top:6px">${p.estimate_note||''}</div>`
      :`<div class="daytype" style="margin-top:12px">🚫 No entry tonight — ${p.headline||'no valid setup'}</div>`}
      <h4>Do NOT trade when</h4>
      <ul class="rules no">${(p.no_trade||[]).map(r=>`<li>${r}</li>`).join('')}</ul>
      ${(p.data_warnings||[]).length?`<h4>Data not checked (verify manually)</h4>
      <ul class="rules no">${p.data_warnings.map(r=>`<li>${r}</li>`).join('')}</ul>`:''}
      <h4>Risk rules</h4>
      <ul class="rules">${(p.risk_rules||[]).map(r=>`<li>${r}</li>`).join('')}</ul>
      <div class="csub" style="margin-top:10px">${p.cost_note||''}</div>
    </div></div>`;
}

// ---------- MONITOR (MONITOR → ENTRY / NO_ENTRY, live) ----------
// The plan gives a 5-session window for a resting limit. This tab answers, for
// every setup, which of three things is true right now: still worth watching
// (and how close), filled (and how it is going), or dead (and exactly why).
let _monT=null, _lastAlertId=0, _alertsSeen=false;
const PHASE_LABEL={ENTRY:'ENTRY — filled, managing', MONITOR:'MONITOR — window open, watching', NO_ENTRY:'NO ENTRY — decided, do not chase'};
const STATE_HELP={
  watching:'window open, price still above the zone', approaching:'within 0.75 ATR of the entry — get the order in',
  at_entry:'price is at the zone right now', in_trade:'filled — manage stop / T1 / trail', closed:'trade finished',
  broken:'zone was run through before a fill — too late, it is not support', expired:'window ended, price never came back',
  ran_away:'window ended with price 2+ ATR higher — missed, not wrong', superseded:'a newer plan replaced this one'};

async function renderMonitor(){
  const bar=$('monBar'), tiles=$('monTiles'), box=$('monPhases');
  try{
    const j=await fetch('/api/swing/monitor').then(r=>r.json());
    if(!j.ok){ box.innerHTML=`<div class="empty">${j.error||'no swing plans to monitor'}</div>`; bar.innerHTML=''; return; }
    const c=j.counts||{};
    bar.innerHTML=`Swing setup monitor · ${j.market_open?'<b style="color:var(--green)">● market open — live prices</b>':'<span class="q">○ market closed — last close</span>'}`
      +` · re-evaluates every minute on the server, this page refreshes every 30s · <span class="q">${(j.at||'').replace('T',' ').slice(0,19)}</span>`;
    tiles.innerHTML=[['ENTRY',c.ENTRY||0,'filled / in trade','pos'],['MONITOR',c.MONITOR||0,'still watching',''],['NO_ENTRY',c.NO_ENTRY||0,'decided: no trade','']]
      .map(([k,v,d,cl])=>`<div class="tile"><div class="t">${k.replace('_',' ')}</div><div class="v ${cl}">${v}</div><div class="d">${d}</div></div>`).join('');
    const badge=$('monBadge'); const urgent=(j.rows||[]).filter(r=>r.state==='at_entry'||r.state==='approaching').length;
    badge.style.display=urgent?'':'none'; badge.textContent=urgent;

    const groups={ENTRY:[],MONITOR:[],NO_ENTRY:[]};
    (j.rows||[]).forEach(r=>(groups[r.phase]||groups.NO_ENTRY).push(r));
    box.innerHTML=['ENTRY','MONITOR','NO_ENTRY'].map(ph=>{
      const rows=groups[ph];
      return `<div class="phase ${ph}"><div class="phase-h">${PHASE_LABEL[ph]}<span class="n">${rows.length} setup${rows.length===1?'':'s'}</span></div>
        ${rows.length?rows.map(monRow).join(''):`<div class="empty" style="padding:18px">none</div>`}</div>`;
    }).join('');
    await loadAlerts();
  }catch(e){ box.innerHTML='<div class="empty">could not load the monitor</div>'; }
}
function monRow(r){
  const z=r.zone||{};
  const dist = r.dist_pct!=null ? `${fmt(r.dist_pct)}% · ${fmt(r.dist_atr)} ATR above entry` : (r.unrealized_pct!=null?`<b class="${r.unrealized_pct>=0?'pos':'neg'}">${pct(r.unrealized_pct)}</b> unrealized`:'—');
  const win = r.phase==='MONITOR' ? `${r.sessions_left!=null?r.sessions_left+' session(s) left':'—'}<div class="q">window to ${r.entry_by||'—'}</div>`
            : r.phase==='ENTRY'  ? `filled ${fmt(r.fill_price)}<div class="q">${r.fill_date||''}${r.broke_zone?' · <span style="color:var(--red)">zone broke</span>':''}</div>`
            : `<div class="q">${r.updated_at?r.updated_at.replace('T',' ').slice(0,16):''}</div>`;
  const hist=(r.history||[]).slice(-3).map(h=>`${(h.at||'').slice(5,16).replace('T',' ')} ${h.state}`).join(' → ');
  return `<div class="mrow ${r.state}">
    <div><div class="sym">${r.tsym}</div><div class="q">${r.sector||''} · score ${r.score??'—'}</div></div>
    <div><div><b>${r.setup_name||''}</b> <span class="q">${r.entry_type||''} ${fmt(r.entry)} · stop ${fmt(r.stop)} · T1 ${fmt((r.targets||[])[0])}${z.top?` · zone ${fmt(z.bottom)}–${fmt(z.top)}`:''}</span></div>
      <div class="why">${r.reason||STATE_HELP[r.state]||''}</div>
      ${hist?`<div class="hist">${hist}</div>`:''}</div>
    <div><span class="st ${r.state}">${(r.state||'').replace('_',' ')}</span></div>
    <div class="mono">${r.ltp!=null?'₹'+fmt(r.ltp):'—'}<div class="q">${dist}</div></div>
    <div class="mono">${win}</div>
    <div style="grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;margin-top:-4px">
      <button class="dlbtn" onclick="openChart('${r.tsym}')">📈 Chart</button></div>
  </div>`;
}
async function loadAlerts(){
  const box=$('monAlerts');
  const j=await fetch('/api/swing/monitor/alerts?limit=60').then(r=>r.json());
  const al=j.alerts||[];
  if(!al.length){ box.innerHTML='<div class="empty">No alerts yet — the first fires when a setup moves state.</div>'; return; }
  // pop a browser notification for anything new since last poll (not on first load)
  if(_alertsSeen){
    al.filter(a=>a.id>_lastAlertId && !a.acked).forEach(a=>{
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification(a.title,{body:a.body,tag:'swing-'+a.id}); }catch(e){}
      }
    });
  }
  _alertsSeen=true; _lastAlertId=Math.max(_lastAlertId, j.max_id||0);
  box.innerHTML=al.map(a=>`<div class="arow ${a.acked?'':'unread'}">
    <div class="mono q">${(a.at||'').replace('T',' ').slice(0,16)}</div>
    <div><span class="lvl ${a.level}">${a.level}</span><b>${a.title}</b><div class="why">${a.body||''}</div>
      <div class="q">${a.setup_name||''} · plan ${a.plan_date||''}</div></div></div>`).join('');
}

// ---------- SCORECARD (plan-vs-actual review) ----------
const _autoScored={};   // mode|date -> true, so a missing scorecard is auto-scored ONCE
async function renderScore(date){
  const tiles=$('tiles'), results=$('results'), honesty=$('honesty');
  if(MODE==='swing') return renderSwingScore(date);
  if(!date){ tiles.innerHTML=''; results.innerHTML='<div class="empty">No plans built yet.</div>'; honesty.style.display='none'; return; }
  // A future/today's-still-open session has no candles yet — say so instantly
  // instead of asking the backend to score it (it would only find nothing).
  if(date>=todayIST()){
    tiles.innerHTML=''; honesty.style.display='none';
    results.innerHTML='<div class="empty">'+date+' hasn\'t happened yet — nothing to score.<br>Pick an earlier date; it scores automatically.</div>';
    return;
  }
  results.innerHTML='<div class="empty">loading…</div>';

  let j=await fetch('/api/plan/scorecard?date='+date).then(r=>r.json());
  if((!j.ok||!(j.results||[]).length) && !_autoScored['day|'+date]){
    _autoScored['day|'+date]=true;
    setStatus('Scoring the '+date+' plan against actual candles…');
    try{ await fetch('/api/plan/score?plan_date='+date); }catch(e){}
    j=await fetch('/api/plan/scorecard?date='+date).then(r=>r.json());
    setStatus('Scored '+date+'.');
  }
  const rep=await fetch('/api/plan/report?date='+date).then(r=>r.json());
  const planBy={}; (rep.plans||[]).forEach(p=>planBy[p.tsym]=p);

  const res=(j.results||[]);
  if(!res.length){
    tiles.innerHTML=''; honesty.style.display='none';
    results.innerHTML='<div class="empty">No traded candles for <b>'+date+'</b> yet — this session hasn\'t happened (or was a holiday).<br>Pick an earlier date; it will score automatically.</div>';
    return;
  }
  const a=j.scorecard||{};
  const cls=v=>v>0?'pos':v<0?'neg':'';
  tiles.innerHTML=`
    <div class="tile"><div class="t">Win rate (taken trades)</div><div class="v ${a.hit_rate>=0.5?'pos':'neg'}">${a.hit_rate!=null?(a.hit_rate*100).toFixed(0)+'%':'—'}</div><div class="d">${a.n_win??0}W / ${a.n_loss??0}L of ${a.n_trades??0} taken · one per stock</div></div>
    <div class="tile"><div class="t">Stood down (no-trade)</div><div class="v">${a.n_no_trade??0}</div><div class="d">flow said don't trade — not losses · ${a.n_pending??0} pending</div></div>
    <div class="tile"><div class="t">Plan success (checks)</div><div class="v ${a.checks_success>=0.5?'pos':'neg'}">${a.checks_success!=null?(a.checks_success*100).toFixed(0)+'%':'—'}</div><div class="d">✓${a.checks_right??0} · ✗${a.checks_wrong??0} predictions</div></div>
    <div class="tile"><div class="t">Expectancy / trade</div><div class="v ${cls(a.expectancy_pct)}">${a.expectancy_pct!=null?pct(a.expectancy_pct):'—'}</div><div class="d">${a.expectancy_bps??'—'} bps net of cost</div></div>
    <div class="tile"><div class="t">Book net (1/stock)</div><div class="v ${cls(a.book_net_pct)}">${a.book_net_pct!=null?pct(a.book_net_pct):'—'}</div><div class="d">sum of primary trades</div></div>
    <div class="tile"><div class="t">Profit factor</div><div class="v">${a.profit_factor??'—'}</div><div class="d">gains ÷ losses</div></div>`;
  honesty.style.display='';honesty.innerHTML='📏 <b>Honest read:</b> '+(a.honesty_note||'Plan checks grade the prediction; trade stats are a simulated, cost-adjusted replay. Small samples prove nothing.');

  // sort: best plan-success first, then net
  res.sort((x,y)=>((y.analysis?.success_rate??-1)-(x.analysis?.success_rate??-1)) ||
                  ((y.summary?.book_net_pct??0)-(x.summary?.book_net_pct??0)));
  results.innerHTML=res.map((r,i)=>scoreCard(r,planBy[r.tsym],i)).join('');
}

function scoreCard(r,p,i){
  const A=r.analysis||{}, d=A.day||{}, s=r.summary||{}, prim=s.primary, h=(p&&p.headline)||{};
  const sr=A.success_rate;
  const srChip = sr!=null?`<span class="chip ${sr>=0.5?'high':'lowr'}">✓${A.right} ✗${A.wrong} · ${(sr*100).toFixed(0)}%</span>`:'<span class="chip low">no checks</span>';
  const netChip = (prim&&prim.net_pct!=null)?`<span class="chip ${prim.net_pct>0?'high':'lowr'}">${pct(prim.net_pct)}</span>`:'<span class="chip low">no fill</span>';
  const checks=(A.checks||[]).map(c=>`
    <tr><td style="white-space:nowrap"><b>${c.aspect}</b></td>
        <td>${c.predicted}</td><td>${c.actual}</td>
        <td align="center"><span class="verd ${c.verdict}">${c.verdict==='RIGHT'?'✓ RIGHT':c.verdict==='WRONG'?'✗ WRONG':c.verdict}</span></td></tr>`).join('');
  const plan = p ? `
      ${h.read?`<div style="font-weight:700;margin-bottom:8px">🎯 ${h.read}</div>`:''}
      ${h.primary_play?`<div class="hl-play" style="margin-bottom:10px"><b>▶</b> ${h.primary_play}</div>`:''}
      <div class="mono" style="font-size:12px;line-height:1.9">
        Prev day: ${fmt(p.levels?.prev_day?.PDH)} / ${fmt(p.levels?.prev_day?.PDL)} / ${fmt(p.levels?.prev_day?.PDC)}<br>
        CPR (${p.levels?.cpr?.class}): TC ${fmt(p.levels?.cpr?.TC)} · P ${fmt(p.levels?.cpr?.P)} · BC ${fmt(p.levels?.cpr?.BC)}<br>
        Pivots: R1 ${fmt(p.levels?.pivots?.R1)} · S1 ${fmt(p.levels?.pivots?.S1)} · Camarilla H3 ${fmt(p.levels?.camarilla?.H3)} · L3 ${fmt(p.levels?.camarilla?.L3)}
      </div>
      <div style="margin-top:10px">${(p.setups||[]).map(st=>`
        <div style="font-size:11.5px;padding:4px 0;border-top:1px solid var(--border)">
          <span class="side ${st.side}">${st.side}</span> <b>${st.name}</b> —
          <span class="mono">entry ${fmt(st.entry)} · stop ${fmt(st.stop)} · T ${(st.targets||[]).map(fmt).join('/')}</span>
        </div>`).join('')}
      </div>` : '<div class="q">plan JSON not found for this date</div>';
  const outcomes=(r.setups||[]).map(st=>{
    const badge = st.status==='filled'
      ? `<span class="verd ${st.net_pct>0?'RIGHT':'WRONG'}">${st.net_pct>0?'WIN':'LOSS'} ${pct(st.net_pct)}</span>`
      : st.status==='tick_gate_failed'
      ? `<span class="verd WRONG">✋ order-flow gate</span>`
      : `<span class="verd INFO">${st.status.replace(/_/g,' ')}</span>`;
    const extra = st.status==='filled' ? `<span class="mono q"> ${fmt(st.entry)} → ${fmt(st.exit)} · ${st.reached}</span>`
      : st.status==='skipped_by_filter' && st.filter_reason ? `<span class="q"> ${st.filter_reason}</span>`
      : st.status==='tick_gate_failed' && st.tick_gate ? `<span class="q"> book imb ${(st.tick_gate.imbalance*100).toFixed(0)}% · ↑${st.tick_gate.up_ticks}/↓${st.tick_gate.down_ticks} against the trade</span>`
      : '';
    return `<div style="font-size:11.5px;padding:4px 0;border-top:1px solid var(--border)">
      <span class="side ${st.side}">${st.side}</span> ${st.name} ${badge}${extra}
    </div>`;}).join('');
  return `<div class="card" id="sc${i}">
    <div class="chead" onclick="document.getElementById('sc${i}').classList.toggle('open')">
      <div class="rankn">${i+1}</div>
      <div><div class="sym">${r.tsym}</div>
        <div class="csub">${h.read||('conviction '+(r.conviction||'—'))}</div></div>
      <div class="chips">${srChip}${netChip}${s.plan_correct?'<span class="chip high">primary ✓</span>':''}</div>
    </div>
    <div class="cbody">
      <div class="sc-grid">
        <div class="colbox">
          <div class="colhead">The plan (as built the evening before)</div>
          ${plan}
        </div>
        <div class="colbox">
          <div class="colhead">What actually happened</div>
          <div class="mono" style="font-size:12.5px;margin-bottom:10px">
            O ${fmt(d.open)} · H ${fmt(d.high)} · L ${fmt(d.low)} · C ${fmt(d.close)}
            <span class="${(d.return_pct||0)>=0?'pos':'neg'}">(${d.return_pct!=null?(d.return_pct>=0?'+':'')+d.return_pct+'%':'—'} open→close)</span>
            · trendiness ${fmt(d.trendiness)}
          </div>
          <div class="colhead" style="margin-top:4px">Right vs wrong</div>
          <div class="scroll"><table style="font-size:11.5px"><thead><tr><th>Check</th><th>Plan said</th><th>Market did</th><th>Verdict</th></tr></thead>
            <tbody>${checks}</tbody></table></div>
          <div class="colhead" style="margin-top:12px">Setup outcomes (simulated, net of cost)</div>
          ${outcomes||'<div class="q">no setups evaluated</div>'}
        </div>
      </div>
    </div></div>`;
}

async function renderSwingScore(date){
  const tiles=$('tiles'), results=$('results'), honesty=$('honesty');
  if(!date){ tiles.innerHTML=''; results.innerHTML='<div class="empty">No swing plans built yet.</div>'; honesty.style.display='none'; return; }
  if(date>=todayIST()){
    tiles.innerHTML=''; honesty.style.display='none';
    results.innerHTML='<div class="empty">The '+date+' swing plan hasn\'t traded yet — nothing to score.<br>Pick an earlier date; it scores automatically (open positions show as OPEN).</div>';
    return;
  }
  results.innerHTML='<div class="empty">loading…</div>';
  let j=await fetch(api.scorecard(date)).then(r=>r.json());
  // swing plans keep evolving while positions are open — re-score on every view
  if(!_autoScored['swing|'+date] || !(j.results||[]).length){
    _autoScored['swing|'+date]=true;
    setStatus('Replaying the '+date+' swing plan against the daily candles since…');
    try{ await fetch(api.score(date)); }catch(e){}
    j=await fetch(api.scorecard(date)).then(r=>r.json());
    setStatus('Scored '+date+'.');
  }
  const res=(j.results||[]);
  if(!res.length){
    tiles.innerHTML=''; honesty.style.display='none';
    results.innerHTML='<div class="empty">No completed sessions after <b>'+date+'</b> yet — check back tomorrow evening.</div>';
    return;
  }
  const a=j.scorecard||{};
  const cls=v=>v>0?'pos':v<0?'neg':'';
  tiles.innerHTML=`
    <div class="tile"><div class="t">Swings taken</div><div class="v">${a.n_trades??0}</div><div class="d">${a.n_win??0}W / ${a.n_loss??0}L · ${a.n_no_trade??0} no-trade · ${a.n_open??0} still open</div></div>
    <div class="tile"><div class="t">Hit rate</div><div class="v ${a.hit_rate>=0.5?'pos':'neg'}">${a.hit_rate!=null?(a.hit_rate*100).toFixed(0)+'%':'—'}</div><div class="d">closed swings only</div></div>
    <div class="tile"><div class="t">Expectancy / swing</div><div class="v ${cls(a.expectancy_pct)}">${a.expectancy_pct!=null?pct(a.expectancy_pct):'—'}</div><div class="d">net of ~${a.cost_pct_per_trade??0.35}% delivery cost</div></div>
    <div class="tile"><div class="t">Book net</div><div class="v ${cls(a.book_net_pct)}">${a.book_net_pct!=null?pct(a.book_net_pct):'—'}</div><div class="d">one primary swing per stock</div></div>
    <div class="tile"><div class="t">Profit factor</div><div class="v">${a.profit_factor??'—'}</div><div class="d">gains ÷ losses</div></div>
    <div class="tile"><div class="t">Avg days held</div><div class="v">${a.avg_days_held??'—'}</div><div class="d">open unrealized: ${a.open_unrealized_pct!=null?pct(a.open_unrealized_pct):'—'}</div></div>`;
  honesty.style.display='';honesty.innerHTML='📏 <b>Honest read:</b> '+(a.honesty_note||'Simulated, cost-adjusted replay. Small samples prove nothing.');
  const order={'win':0,'loss':1,'open':2,'no-trade':3,'no-plan':4};
  res.sort((x,y)=>(order[x.outcome]??9)-(order[y.outcome]??9) || ((y.net_pct??-99)-(x.net_pct??-99)));
  results.innerHTML=res.map((r,i)=>swingScoreCard(r,i)).join('');
}

// ---------- TXT downloads ----------
const LINE='='.repeat(64), THIN='-'.repeat(64);
function planToText(p){
  const L=p.levels||{}, pd=L.prev_day||{}, cpr=L.cpr||{}, cam=L.camarilla||{}, piv=L.pivots||{}, z=L.smc_zones||{}, h=p.headline||{}, sw=p.swing_outlook||{};
  const zl=a=>(a||[]).map(x=>`${x.kind} ${fmt(x.bottom)}-${fmt(x.top)}`).join(' · ')||'—';
  const out=[];
  out.push(LINE);
  out.push(` ${p.tsym} — ₹${fmt(p.last_close)} · plan for ${p.plan_date||PLAN_DATE}`);
  out.push(` ${String(p.bias||'').toUpperCase()} bias · ${p.conviction} conviction · score ${p.score} · rank ${p.universe_rank||'—'}${p.turnover_cr?` · ₹${p.turnover_cr}cr turnover`:''}`);
  out.push(` Sector: ${sectorOf(p)}${hasEntry(p)?'   [ENTRY TONIGHT]':'   [no entry — watch only]'}`);
  out.push(LINE);
  if(h.read){ out.push('', "TODAY'S READ", `  ${h.read}`); }
  if(h.primary_play){ out.push('', 'PRIMARY PLAY', `  ${h.primary_play}`); }
  if((h.if_then||[]).length){ out.push('', 'IF -> THEN'); h.if_then.forEach(x=>out.push(`  - ${x}`)); }
  out.push('', `DAY TYPE: ${p.day_type_hint||'—'}`);
  out.push('', `KEY LEVELS (from ${pd.date||"today's"} candle)`, THIN);
  out.push(`  Prev day H/L/C : ${fmt(pd.PDH)} / ${fmt(pd.PDL)} / ${fmt(pd.PDC)}   (range ${fmt(pd.range)})`);
  out.push(`  ATR14 · RVOL   : ${fmt(L.atr14)} · ${fmt(L.rvol)}x`);
  out.push(`  CPR (${cpr.class||'—'})   : TC ${fmt(cpr.TC)} · P ${fmt(cpr.P)} · BC ${fmt(cpr.BC)}`);
  out.push(`  Camarilla      : H4 ${fmt(cam.H4)} · H3 ${fmt(cam.H3)} · L3 ${fmt(cam.L3)} · L4 ${fmt(cam.L4)}`);
  out.push(`  Pivots         : R2 ${fmt(piv.R2)} · R1 ${fmt(piv.R1)} · P ${fmt(piv.P)} · S1 ${fmt(piv.S1)} · S2 ${fmt(piv.S2)}`);
  out.push(`  SMC supply ↑   : ${zl(z.above)}`);
  out.push(`  SMC demand ↓   : ${zl(z.below)}`);
  out.push('', 'WHERE IT OPENS -> WHAT TO DO', THIN);
  (p.open_scenarios||[]).forEach(s=>{
    out.push(`  IF ${s.open_where}`);
    out.push(`     EXPECT: ${s.expect}`);
    out.push(`     DO    : ${s.do}`);
    out.push(`     AVOID : ${s.avoid}`, '');
  });
  out.push(`SETUPS — take max ${p.max_trades} trade(s)`, THIN);
  (p.setups||[]).forEach((s,i)=>{
    out.push(`  ${i+1}. [${s.side} · ${s.quality}] ${s.name}   (${s.source})`);
    out.push(`     Trigger : ${s.trigger_dir==='above'?'above':'below'} ${fmt(s.trigger_price)} — ${s.trigger}`);
    out.push(`     Entry ${fmt(s.entry)} · Stop ${fmt(s.stop)} · Targets ${(s.targets||[]).map(fmt).join(' / ')} (${s.rr_t1}R->${s.rr_final}R)`);
    if((s.context_targets||[]).length) out.push(`     Near levels: ${s.context_targets.map(fmt).join(', ')}`);
    out.push(`     Size    : ${s.shares_for_risk??'—'} shares @ ₹${s.risk_rupees||1000} risk`);
    out.push(`     Valid   : ${s.valid_when}`);
    out.push(`     Skip if : ${s.skip_when}`, '');
  });
  out.push('2-DAY SWING OUTLOOK', THIN);
  out.push(`  ${String(sw.bias||'').toUpperCase()} — ${sw.note||'—'}`);
  out.push(`  Invalidation ${fmt(sw.invalidation)} · 2-day range ${fmt(sw.downside_2d)} - ${fmt(sw.upside_2d)}`);
  out.push('', 'DO NOT TRADE WHEN', THIN);
  (p.no_trade||[]).forEach(r=>out.push(`  - ${r}`));
  out.push('', 'RISK RULES', THIN);
  (p.risk_rules||[]).forEach(r=>out.push(`  - ${r}`));
  out.push('', THIN, `  ${p.cost_note||'Analysis only — no orders are placed and no profit is promised.'}`, '');
  return out.join('\n');
}
function downloadText(name, text){
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function downloadOne(i){
  const p=PLANS[i]; if(!p) return;
  const toText = MODE==='swing' ? swingToText : planToText;
  downloadText(`${MODE==='swing'?'swing':'plan'}_${p.tsym}_${p.plan_date||PLAN_DATE}.txt`, toText(p));
}
async function downloadAll(){
  // Context-aware: on the Plan tab this saves the day's PLAN; on the Scorecard
  // tab it saves the plan-vs-actual ANALYSIS for the selected date.
  if(TAB==='score') return downloadScorecardTxt();
  const date=$('dateSel').value; if(!date){ setStatus('Pick a date first.'); return; }
  let plans=PLANS, d=PLAN_DATE;
  if(!plans.length || d!==date){
    const j=await fetch(api.report(date)).then(r=>r.json());
    if(!j.ok||!j.plans.length){ setStatus('No plans stored for '+date+'.'); return; }
    plans=(j.plans||[]).slice().sort(byPriority); d=date;
  }
  const label=MODE==='swing'?'SWING PLAN (2–22 session delivery holds, up to ~1 month)':'DAILY PLAN';
  const toText = MODE==='swing' ? swingToText : planToText;
  const nEntry=plans.filter(hasEntry).length;

  // Same shape as the page: sector sections, entries first inside each.
  const bySector=new Map();
  plans.forEach(p=>{const k=sectorOf(p); if(!bySector.has(k)) bySector.set(k,[]); bySector.get(k).push(p);});
  const secOrder=[...bySector.entries()].map(([name,ps])=>({name,ps,
      entries:ps.filter(hasEntry).length,
      best:Math.max(...ps.map(p=>p.score==null?-1:p.score))}))
    .sort((a,b)=>(b.entries>0?1:0)-(a.entries>0?1:0) ||
                 (a.name==='Unclassified'?1:0)-(b.name==='Unclassified'?1:0) ||
                 b.entries-a.entries || b.best-a.best);

  const head=[LINE,` ${label} — ${d} · ${plans.length} stocks (top volume leaders ≤ ₹300)`,
    ` ${nEntry} with an entry · ${secOrder.length} sectors`,
    ' Entries first, then confluence score · Generated by trade.scratchforge backend',
    ' Analysis only — no orders are placed and no profit is promised.',LINE,'',
    ' SECTOR SUMMARY',THIN,
    ...secOrder.map(g=>`  ${g.name.padEnd(34)} ${String(g.ps.length).padStart(3)} stock${g.ps.length===1?' ':'s'} · ${g.entries} entr${g.entries===1?'y  ':'ies'} · best score ${g.best<0?'—':g.best}`),
    '',''].join('\n');

  const body=secOrder.map(g=>[
    '', LINE, ` SECTOR: ${g.name.toUpperCase()} — ${g.ps.length} stock(s), ${g.entries} with an entry`, LINE, '',
    g.ps.map(toText).join('\n\n')].join('\n')).join('\n');

  downloadText(`${MODE==='swing'?'swing':'plan'}_ALL_${d}.txt`, head + body);
}

function swingToText(p){
  const T=p.trend||{}, pr=p.profile||{}, ew=p.entry_window||{}, mr=p.market_regime||{};
  const out=[];
  out.push(LINE);
  out.push(` ${p.tsym} — ₹${fmt(p.last_close)} · SWING plan live from ${p.plan_date||PLAN_DATE}`);
  out.push(` ${String(p.bias||'').toUpperCase()} · stage: ${p.stage} (template ${T.template_passes??'—'}/7) · ${p.conviction} conviction · score ${p.score} · rank ${p.universe_rank||'—'}${p.turnover_cr?` · ₹${p.turnover_cr}cr turnover`:''}`);
  out.push(` Sector: ${sectorOf(p)}${hasEntry(p)?'   [ENTRY TONIGHT]':'   [no entry — watch only]'}`);
  out.push(LINE);
  out.push('', 'THE READ', `  ${p.headline||'—'}`);
  if(mr.breadth_above_sma200!=null) out.push(`  Market breadth: ${(mr.breadth_above_sma200*100).toFixed(0)}% of universe above 200-SMA — regime ${mr.on?'ON':'OFF'}`);
  out.push('', `ENTRY WINDOW: ${ew.first_session||'—'} -> ${ew.last_session||'—'} (${ew.note||''})`);
  out.push('', 'TREND & MOMENTUM', THIN);
  out.push(`  SMA 50/150/200    : ${fmt(T.sma50)} / ${fmt(T.sma150)} / ${fmt(T.sma200)}`);
  out.push(`  52w high/low      : ${fmt(T.week52_high)} / ${fmt(T.week52_low)}  (${fmt(T.pct_from_52w_high)}% from high)`);
  out.push(`  Returns 21/63/126d: ${pct(T.ret_21d)} · ${pct(T.ret_63d)} · ${pct(T.ret_126d)} · momentum rank ${T.momentum_percentile!=null?T.momentum_percentile+' pctile':'—'}`);
  out.push('', 'RISK PROFILE', THIN);
  out.push(`  ATR14 ${fmt(pr.atr14)} (${fmt(pr.atr_pct)}%/day) · RVOL ${fmt(pr.rvol)}x · median turnover ₹${fmt(pr.med_turnover_cr_20d)}cr/d`);
  out.push(`  Gaps>3% in 20d: ${pr.gap3_count_20d??'—'} · locked-circuit closes 60d: ${pr.locked_circuit_60d??'—'} · up/down vol 20d: ${fmt(pr.updown_vol_ratio_20d)}`);
  const M=p.smc||{}, V=p.volume_profile||{}, H=p.htf||{};
  if(M.ok){
    const dr=M.dealing_range||{};
    out.push('', 'STRUCTURE — ORDER BLOCKS / FVG / DEALING RANGE', THIN);
    out.push(`  Price zone     : ${String(M.price_zone||'—').toUpperCase()}${M.in_ote?' (inside OTE 0.618-0.79)':''}`);
    out.push(`  Dealing range  : ${fmt(dr.low)} .. EQ ${fmt(dr.eq)} .. ${fmt(dr.high)}`);
    out.push(`  OTE band       : ${fmt(dr.ote_bottom)} - ${fmt(dr.ote_top)}`);
    if(M.fresh_ssl_sweep) out.push(`  Liquidity sweep: SSL grabbed at ${fmt(M.fresh_ssl_sweep.price)} and reclaimed`);
    (M.refined||[]).forEach(z=>out.push(`  * REFINED OB+FVG : ${fmt(z.bottom)} - ${fmt(z.top)}  (${z.width_atr}xATR wide, ${fmt(z.dist_pct)}% below)`));
    (M.demand_ob||[]).forEach(z=>out.push(`    demand OB      : ${fmt(z.bottom)} - ${fmt(z.top)}  (${fmt(z.dist_pct)}% below)`));
    (M.bull_fvg||[]).forEach(z=>out.push(`    bullish FVG    : ${fmt(z.bottom)} - ${fmt(z.top)}  CE ${fmt(z.ce)}`));
    (M.breakers||[]).forEach(z=>out.push(`    breaker (supp) : ${fmt(z.bottom)} - ${fmt(z.top)}`));
    (M.supply_ob||[]).forEach(z=>out.push(`    supply OB (tgt): ${fmt(z.bottom)} - ${fmt(z.top)}`));
    (M.bear_fvg||[]).forEach(z=>out.push(`    bearish FVG(tgt): ${fmt(z.bottom)} - ${fmt(z.top)}`));
  }
  if(V.ok){
    out.push('', `VOLUME PROFILE (composite, ${V.sessions} daily sessions)`, THIN);
    out.push(`  POC ${fmt(V.poc)} · VAH ${fmt(V.vah)} · VAL ${fmt(V.val)}   [price ${String(V.position||'').replace(/_/g,' ')}]`);
    out.push(`  Naked POC : ${(V.naked_poc||[]).map(n=>`${fmt(n.price)} (${n.side}, ${n.sessions_ago}s ago)`).join(' · ')||'—'}`);
    out.push(`  HVN       : ${(V.hvn||[]).map(h=>fmt(h.price)).join(' · ')||'—'}`);
    out.push(`  LVN       : ${(V.lvn||[]).map(l=>fmt(l.price)).join(' · ')||'—'}`);
  }
  if(H.stage) out.push('', `WEEKLY (HTF): ${H.stage.replace(/_/g,' ')} · 10w ${fmt(H.sma10w)} · 30w ${fmt(H.sma30w)} · aligned for long: ${H.aligned_for_long?'YES':'NO'}`);
  out.push('', 'SETUPS', THIN);
  if(!(p.setups||[]).length) out.push('  NO ENTRY TONIGHT — '+(p.headline||''));
  (p.setups||[]).forEach((s,i)=>{
    out.push(`  ${i+1}. [${s.side} · ${s.quality}] ${s.name}   (${s.source})`);
    const _ot = s.entry_type ? 'BUY LIMIT' : 'buy-stop';
    out.push(`     Trigger : ${_ot} ${fmt(s.trigger_price)}, limit cap ${fmt(s.limit_price)} (never chase past the cap) — ${s.trigger}`);
    out.push(`     Entry ${fmt(s.entry)} · Stop ${fmt(s.stop)} · Targets ${(s.targets||[]).map(fmt).join(' / ')} (${s.rr_t1}R->${s.rr_final}R)`);
    out.push(`     Size    : ${s.shares_for_risk??'—'} shares @ ₹${s.risk_rupees||1000} risk`);
    out.push(`     Timing  : enter by ${s.entry_by||'—'} · ~${s.expected_hold_sessions} sessions to target (~ ${s.expected_exit_date||'—'}, heuristic) · HARD EXIT BY ${s.exit_by_date||'—'}`);
    if(s.no_progress) out.push(`     No-progress: exit if < +${s.no_progress.min_gain_pct}% after ${s.no_progress.after_sessions} sessions`);
    out.push(`     Valid   : ${s.valid_when}`);
    out.push(`     Skip if : ${s.skip_when}`, '');
  });
  (p.setups||[]).forEach(s=>{
    const e=s.exit_plan; if(!e) return;
    out.push(`  EXIT PLAN — ${s.name}`);
    if(e.t1_action)     out.push(`     T1     : ${e.t1_action}`);
    if(e.runner_action) out.push(`     Runner : ${e.runner_action}`);
    (e.target_basis||[]).forEach(b=>out.push(`     Target : ${b}`));
    if(e.lvn_ahead&&e.lvn_ahead.length) out.push(`     LVN    : ${e.lvn_ahead.map(fmt).join(', ')} — ${e.lvn_note||''}`);
    if(e.invalidation)  out.push(`     Invalid: ${e.invalidation}`);
    out.push('');
  });
  if((p.setups||[]).length) out.push(`  ${p.estimate_note||''}`,'');
  out.push('DO NOT TRADE WHEN', THIN);
  (p.no_trade||[]).forEach(r=>out.push(`  - ${r}`));
  if((p.data_warnings||[]).length){ out.push('', 'DATA NOT CHECKED (verify manually)', THIN); p.data_warnings.forEach(r=>out.push(`  - ${r}`)); }
  out.push('', 'RISK RULES', THIN);
  (p.risk_rules||[]).forEach(r=>out.push(`  - ${r}`));
  out.push('', THIN, `  ${p.cost_note||'Analysis only — no orders are placed and no profit is promised.'}`, '');
  return out.join('\n');
}

function scoreToText(r, p){
  const A=r.analysis||{}, d=A.day||{}, s=r.summary||{}, prim=s.primary, h=(p&&p.headline)||{};
  const out=[];
  const sr=A.success_rate!=null?` · checks ✓${A.right} ✗${A.wrong} (${(A.success_rate*100).toFixed(0)}%)`:'';
  const pn=(prim&&prim.net_pct!=null)?` · primary ${prim.net_pct>0?'WIN':'LOSS'} ${pct(prim.net_pct)}`:' · primary: no fill';
  out.push(THIN, `${r.tsym}${sr}${pn}${s.plan_correct?' · plan ✓':''}`, THIN);
  if(h.read) out.push(`  Plan said : ${h.read}`);
  out.push(`  Actual day: O ${fmt(d.open)} · H ${fmt(d.high)} · L ${fmt(d.low)} · C ${fmt(d.close)}`
          +`  (${d.return_pct!=null?(d.return_pct>=0?'+':'')+d.return_pct+'%':'—'} open→close · trendiness ${fmt(d.trendiness)})`);
  out.push('', '  RIGHT vs WRONG');
  (A.checks||[]).forEach(c=>{
    const v=c.verdict==='RIGHT'?'✓ RIGHT':c.verdict==='WRONG'?'✗ WRONG':c.verdict;
    out.push(`   [${v}] ${c.aspect}`);
    out.push(`        plan said : ${c.predicted}`);
    out.push(`        market did: ${c.actual}`);
  });
  out.push('', '  SETUP OUTCOMES (simulated, net of cost)');
  (r.setups||[]).forEach(st=>{
    if(st.status==='filled'){
      out.push(`   [${st.net_pct>0?'WIN ':'LOSS'} ${pct(st.net_pct)}] ${st.side} ${st.name} — ${fmt(st.entry)} → ${fmt(st.exit)} (${st.reached}, ${st.r_multiple}R)`);
    }else if(st.status==='skipped_by_filter'){
      out.push(`   [gated OFF] ${st.side} ${st.name} — ${st.filter_reason||''}`);
    }else if(st.status==='tick_gate_failed'){
      const g=st.tick_gate||{};
      out.push(`   [order-flow gate] ${st.side} ${st.name} — book imb ${g.imbalance!=null?(g.imbalance*100).toFixed(0)+'%':'?'} · ↑${g.up_ticks??'?'}/↓${g.down_ticks??'?'} against the trade`);
    }else{
      out.push(`   [${st.status.replace(/_/g,' ')}] ${st.side} ${st.name}`);
    }
  });
  out.push('');
  return out.join('\n');
}

async function downloadSwingScorecardTxt(){
  const date=$('dateSel').value; if(!date){ setStatus('Pick a date first.'); return; }
  const j=await fetch(api.scorecard(date)).then(r=>r.json());
  const res=j&&j.results||[];
  if(!res.length){ setStatus('No swing scorecard stored for '+date+' yet.'); return; }
  const a=j.scorecard||{};
  const out=[LINE,` SWING SCORECARD — plan vs actual · ${date} · ${res.length} stocks`,
    ` Taken ${a.n_trades??0} (${a.n_win??0}W/${a.n_loss??0}L${a.hit_rate!=null?', hit '+(a.hit_rate*100).toFixed(0)+'%':''}) · ${a.n_open??0} open · ${a.n_no_trade??0} no-trade`,
    ` Expectancy ${a.expectancy_pct!=null?pct(a.expectancy_pct):'—'}/swing · book ${a.book_net_pct!=null?pct(a.book_net_pct):'—'} · PF ${a.profit_factor??'—'} · avg hold ${a.avg_days_held??'—'}d`,
    ' Simulated, cost-adjusted replay of the swing plan against real daily candles — not real trades.',LINE,''];
  res.forEach(r=>{
    const p=r.primary||{};
    out.push(THIN, `${r.tsym} — ${String(r.outcome||'').toUpperCase()}${r.net_pct!=null?' '+pct(r.net_pct):''}`, THIN);
    (r.setups||[]).forEach(st=>{
      if(st.status==='filled'||st.status==='open'){
        out.push(`   [${st.status==='open'?'OPEN':(st.net_pct>0?'WIN ':'LOSS')} ${st.net_pct!=null?pct(st.net_pct):''}] ${st.name} — ${fmt(st.entry)} → ${fmt(st.exit)} (${st.reached||''}, ${st.days_held??'—'}d)${st.selected?' ← primary':''}`);
      }else{
        out.push(`   [${(st.status||'').replace(/_/g,' ')}] ${st.name}${st.reached?' — '+st.reached:''}`);
      }
    });
    out.push('');
  });
  downloadText(`swing_scorecard_${date}.txt`, out.join('\n'));
}

async function downloadScorecardTxt(){
  if(MODE==='swing') return downloadSwingScorecardTxt();
  const date=$('dateSel').value; if(!date){ setStatus('Pick a date first.'); return; }
  if(date>=todayIST()){ setStatus(date+" hasn't happened yet — nothing to download."); return; }
  const [sc,rep]=await Promise.all([
    fetch('/api/plan/scorecard?date='+date).then(r=>r.json()),
    fetch('/api/plan/report?date='+date).then(r=>r.json())]);
  const res=sc&&sc.results||[];
  if(!res.length){ setStatus('No scorecard stored for '+date+' yet.'); return; }
  const planBy={}; (rep.plans||[]).forEach(p=>planBy[p.tsym]=p);
  res.sort((x,y)=>((y.analysis?.success_rate??-1)-(x.analysis?.success_rate??-1)) ||
                  ((y.summary?.book_net_pct??0)-(x.summary?.book_net_pct??0)));
  const a=sc.scorecard||{};
  const head=[LINE,
    ` SCORECARD — plan vs actual · ${date} · ${res.length} stocks`,
    ` Plan success (checks): ${a.checks_success!=null?(a.checks_success*100).toFixed(0)+'%':'—'}`
      +` (✓${a.checks_right??0} / ✗${a.checks_wrong??0})`
      +` · plans whose primary won: ${a.n_plans_correct??0}/${a.n_plans??res.length}`,
    ` Sim trades: ${a.n_trades??0} (${a.n_win??0}W/${a.n_loss??0}L`
      +`${a.hit_rate!=null?', hit '+(a.hit_rate*100).toFixed(0)+'%':''})`
      +` · expectancy ${a.expectancy_pct!=null?pct(a.expectancy_pct):'—'}/trade`
      +` · book ${a.book_net_pct!=null?pct(a.book_net_pct):'—'} · PF ${a.profit_factor??'—'}`,
    ' Simulated, cost-adjusted replay of the plan against real candles — not real trades.',
    LINE,'',''].join('\n');
  downloadText(`scorecard_${date}.txt`, head + res.map(r=>scoreToText(r, planBy[r.tsym])).join('\n'));
}

// ---------- actions ----------
// A 200-stock build fetches candles for 200 symbols and takes minutes, so it
// runs server-side in a background thread and we poll it for progress —
// holding the request open would just 504.
const UNIVERSE_N=200;
let _buildPoll=null;
const buildStatusUrl=()=>MODE==='day'?'/api/plan/build_status':'/api/swing/build_status';

async function runBuild(){
  const b=$('buildBtn'); b.disabled=true; b.textContent='building…';
  setStatus('Starting the next-session '+(MODE==='swing'?'SWING':'day')+` plan build for the top-${UNIVERSE_N} ≤₹300 names…`);
  try{
    const j=await fetch(api.build()+`?background=1&top_n=${UNIVERSE_N}`).then(r=>r.json());
    if(j&&j.job){ pollBuild(); return; }
    // older backend without background builds — it already ran to completion
    setStatus(j.ok===false ? 'Build failed: '+(j.error||'unknown')
      : `Built ${j.built} ${MODE==='swing'?'swing ':''}plans for ${j.plan_date} (source: ${j.universe_source}, ${j.skipped} skipped).`);
    b.disabled=false; b.textContent='⚙ Build next';
    await reload(true);
  }catch(e){
    setStatus('Build failed: '+e);
    b.disabled=false; b.textContent='⚙ Build next';
  }
}

async function pollBuild(){
  clearTimeout(_buildPoll);
  let j;
  try{ j=await fetch(buildStatusUrl()).then(r=>r.json()); }
  catch(e){ _buildPoll=setTimeout(pollBuild,3000); return; }
  const b=$('buildBtn');
  if(j.running){
    b.disabled=true; b.textContent=`building ${j.done}/${j.total||'…'}`;
    setStatus(`Building the ${MODE==='swing'?'swing':'day'} plan — ${j.done}/${j.total||'?'} stocks`
      +`${j.current?' · '+j.current:''} (${j.percent}%). Safe to leave this page; the build keeps running.`);
    _buildPoll=setTimeout(pollBuild,2000);
    return;
  }
  b.disabled=false; b.textContent='⚙ Build next';
  if(j.state==='error'){ setStatus('Build failed: '+(j.error||'unknown')); return; }
  if(j.state==='idle'){ return; }
  const r=j.result||{};
  setStatus(r.plan_date
    ? `Built ${r.built} ${MODE==='swing'?'swing ':''}plans for ${r.plan_date} — universe ${r.universe_size||UNIVERSE_N} names, ${r.skipped} skipped (source: ${r.universe_source}).`
    : 'Build finished.');
  await reload(true);
  loadAutoStatus();
}

// A build started in an earlier page view is still running server-side — pick
// its progress back up instead of showing a stale idle button.
async function resumeBuildIfRunning(){
  try{
    const j=await fetch(buildStatusUrl()).then(r=>r.json());
    if(j&&j.running) pollBuild();
  }catch(e){}
}
async function runScore(){
  const date=$('dateSel').value; if(!date){setStatus('Pick a date first.');return;}
  const b=$('scoreBtn'); b.disabled=true; b.textContent='scoring…';
  setStatus('Scoring '+date+' vs actual candles…');
  try{ const j=await fetch(api.score(date)).then(r=>r.json());
    setStatus(j.ok?`Scored ${j.scored} plans for ${date}.`:'Score: '+(j.error||'failed'));
    showTab('score');
  }catch(e){ setStatus('Score failed: '+e); }
  b.disabled=false; b.textContent='✓ Score date';
}
function setStatus(t){const s=$('status');s.style.display='';s.textContent=t;}

$('foot').innerHTML='<b>Day trade</b>: prev-day levels, CPR, Camarilla, ORB, SMC/FVG confluence — scored net of ~0.25% intraday costs. '
  +'<b>Swing trade</b>: George-Hwang 52-week-high momentum + Minervini/Weinstein Stage-2 gate, Landry pullback resumption, '
  +'Crabel/Bollinger volatility-compression breakouts, plus SMC zone entries — order blocks, fair value gaps (with CE), '
  +'refined OB∩FVG pockets, bullish breakers and liquidity-sweep reclaims, taken only at a discount to the dealing range — '
  +'with targets and stops placed at real structure (supply blocks, unmitigated FVGs, naked POC, value-area edges) '
  +'from a composite daily volume profile. Vol-normalized cross-sectional momentum rank, market-breadth regime gate — '
  +'long-only (retail can\'t short delivery in India), scored net of ~0.65% delivery costs (STT+brokerage+DP+slippage). '
  +'Universe = today\'s top-200 volume leaders ≤₹300, grouped by NSE macro sector — open a sector to see its stocks. '
  +'Order is entries first, then confluence score (a stock with a live entry always outranks a higher-scoring one without). '
  +'Score weights are priors; the scorecard measures them. Educational engineering reference; not investment advice.';
reload();
resumeBuildIfRunning();
loadAutoStatus();
setInterval(loadAutoStatus, 120000);
</script>
